<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentine's Day Question 💝</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Quicksand', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #FFB6C1;
            background-image: 
                repeating-linear-gradient(45deg, transparent, transparent 35px, rgba(255,182,193,.1) 35px, rgba(255,182,193,.1) 70px),
                repeating-linear-gradient(-45deg, transparent, transparent 35px, rgba(255,105,180,.1) 35px, rgba(255,105,180,.1) 70px);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .hearts {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            overflow: hidden;
            z-index: 1;
        }

        .heart {
            position: absolute;
            width: 30px;
            height: 30px;
            animation: float 10s infinite;
            opacity: 0.8;
        }

        .heart svg {
            width: 100%;
            height: 100%;
        }

        @keyframes float {
            0% {
                transform: translateY(100vh) rotate(0deg);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-10vh) rotate(360deg);
                opacity: 0;
            }
        }

        .container {
            background: white;
            padding: 25px 35px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            position: relative;
            z-index: 10;
        }

        h1 {
            font-size: 36px;
            color: #e91e63;
            margin-bottom: 30px;
            font-weight: 700;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.1);
        }

        .emoji {
            width: 60px;
            height: 60px;
            margin: 0 auto 15px;
            display: block;
        }

        .emoji svg {
            width: 100%;
            height: 100%;
        }

        .button-container {
            display: flex;
            gap: 30px;
            justify-content: center;
            align-items: center;
            margin-top: 25px;
            min-height: 150px;
            position: relative;
        }

        button {
            padding: 20px 40px;
            font-size: 24px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            min-width: 140px;
        }

        #yesBtn {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            color: white;
            transform-origin: center;
            transform: scale(1);
            position: relative;
        }

        #noBtn {
            background: linear-gradient(135deg, #a8edea 0%, #fed6e3 100%);
            color: #333;
            position: relative;
        }

        button:hover {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        button:active {
            transform: scale(0.95);
        }

        .celebration {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 40px 20px;
            border-radius: 30px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            text-align: center;
            z-index: 1000;
            animation: popIn 0.5s ease;
            max-width: 95%;
            overflow: auto;
        }

        @keyframes popIn {
            0% {
                transform: translate(-50%, -50%) scale(0);
            }
            100% {
                transform: translate(-50%, -50%) scale(1);
            }
        }

        .celebration h2 {
            font-size: 48px;
            color: #e91e63;
            margin-bottom: 20px;
        }

        .celebration img {
            max-width: 300%;
            width: 300%;
            border-radius: 15px;
            margin-top: 20px;
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 28px;
            }
            
            button {
                padding: 15px 30px;
                font-size: 20px;
                min-width: 120px;
            }
            
            .celebration h2 {
                font-size: 36px;
            }
        }
    </style>
</head>
<body>
    <div class="hearts" id="hearts"></div>
    
    <div class="container" id="mainContainer">
        <div class="emoji">
            <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <path d="M50,90 C50,90 10,60 10,40 C10,25 20,15 30,15 C40,15 45,20 50,30 C55,20 60,15 70,15 C80,15 90,25 90,40 C90,60 50,90 50,90 Z" 
                      fill="none" 
                      stroke="#e91e63" 
                      stroke-width="3" 
                      stroke-linecap="round" 
                      stroke-linejoin="round"/>
            </svg>
        </div>
        <h1>Smoosh, will you be my Valentine?</h1>
        <div class="button-container">
            <button id="yesBtn" onmouseenter="growYesButton()" onclick="showCelebration()">Yes! 💕</button>
            <button id="noBtn" onmousemove="moveNoButtonOnHover(event)" onclick="return false;" ontouchstart="moveNoButtonOnTouch(event)">No</button>
        </div>
    </div>

    <div class="celebration" id="celebration">
        <h2>Yay! 🎉</h2>
        <img src="https://gifdb.com/images/high/stewie-father-peter-griffin-in-a-dress-dancing-xvye0g1ierbzsiec.gif" alt="Peter Griffin dancing">
    </div>

    <script>
        // Create floating hearts background
        function createHearts() {
            var heartsContainer = document.getElementById('hearts');
            for (var i = 0; i < 15; i++) {
                var heart = document.createElement('div');
                heart.className = 'heart';
                heart.innerHTML = '<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg"><path d="M50,90 C50,90 10,60 10,40 C10,25 20,15 30,15 C40,15 45,20 50,30 C55,20 60,15 70,15 C80,15 90,25 90,40 C90,60 50,90 50,90 Z" fill="none" stroke="#e91e63" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
                heart.style.left = Math.random() * 100 + '%';
                heart.style.animationDelay = Math.random() * 10 + 's';
                var size = Math.random() * 20 + 20;
                heart.style.width = size + 'px';
                heart.style.height = size + 'px';
                heartsContainer.appendChild(heart);
            }
        }
        
        // Initialize
        createHearts();

        var currentScale = 1;
        var isNoButtonMoving = false;
        var yesBtn = document.getElementById('yesBtn');
        var noBtn = document.getElementById('noBtn');

        // Yes button grows on hover
        function growYesButton() {
            currentScale = currentScale * 1.5;
            yesBtn.style.transform = 'scale(' + currentScale + ')';
        }

        // Show celebration
        function showCelebration() {
            document.getElementById('celebration').style.display = 'block';
            document.getElementById('mainContainer').style.display = 'none';
        }

        // Move No button to random position
        function moveNoButtonRandom(eventX, eventY) {
            if (isNoButtonMoving) return;
            isNoButtonMoving = true;

            var btnRect = noBtn.getBoundingClientRect();
            var maxX = window.innerWidth - btnRect.width - 40;
            var maxY = window.innerHeight - btnRect.height - 40;
            
            var newX = Math.random() * maxX;
            var newY = Math.random() * maxY;
            
            // Make sure it's not too close to current position
            var attempts = 0;
            while (Math.sqrt(Math.pow(eventX - newX, 2) + Math.pow(eventY - newY, 2)) < 150 && attempts < 10) {
                newX = Math.random() * maxX;
                newY = Math.random() * maxY;
                attempts++;
            }
            
            noBtn.style.position = 'fixed';
            noBtn.style.left = newX + 'px';
            noBtn.style.top = newY + 'px';

            setTimeout(function() {
                isNoButtonMoving = false;
            }, 300);
        }

        // No button dodges cursor (desktop)
        function moveNoButtonOnHover(e) {
            var btnRect = noBtn.getBoundingClientRect();
            var btnCenterX = btnRect.left + btnRect.width / 2;
            var btnCenterY = btnRect.top + btnRect.height / 2;
            
            var distance = Math.sqrt(
                Math.pow(e.clientX - btnCenterX, 2) + 
                Math.pow(e.clientY - btnCenterY, 2)
            );
            
            if (distance < 100) {
                moveNoButtonRandom(e.clientX, e.clientY);
            }
        }

        // No button moves on touch (mobile)
        function moveNoButtonOnTouch(e) {
            e.preventDefault();
            var touch = e.touches[0];
            moveNoButtonRandom(touch.clientX, touch.clientY);
            return false;
        }
    </script>
</body>
</html>
